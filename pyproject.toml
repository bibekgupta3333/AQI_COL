[tool.poetry]
name = "aqi-col"
version = "0.1.0"
description = "Air Quality Index Prediction System for Kathmandu"
authors = ["bibekgupta3333 <bibekgupta3333@gmail.com>"]
readme = "README.md"
packages = [{ include = "aqi_col" }]

[tool.poetry.dependencies]
python = "^3.10"
# Core Django and web framework
django = "^4.2.7"
requests = "^2.31.0"

# Data processing and machine learning
pandas = "^2.1.3"
numpy = "^1.24.3"
scikit-learn = "^1.3.2"
matplotlib = "^3.8.2"
seaborn = "^0.13.0"

# Web scraping
beautifulsoup4 = "^4.12.2"
lxml = "^4.9.3"

# Environment and configuration
python-decouple = "^3.8"
python-dotenv = "^1.0.0"
django-environ = "^0.11.2"

# Database utilities
dj-database-url = "^2.1.0"

# Jupyter notebook support
notebook = "^7.0.6"
jupyter = "^1.0.0"
ipykernel = "^6.26.0"

# Additional utilities
pillow = "^10.1.0"
python-dateutil = "^2.8.2"
pytz = "^2023.3"

[tool.poetry.group.dev.dependencies]
# Development and debugging
django-debug-toolbar = "^4.2.0"
ipython = "^8.17.2"

# Testing
pytest = "^7.4.3"
pytest-django = "^4.7.0"
factory-boy = "^3.3.0"

[tool.poetry.group.prod.dependencies]
# Production dependencies
gunicorn = "^21.2.0"
whitenoise = "^6.6.0"
psycopg2-binary = "^2.9.9"
django-redis = "^5.4.0"
redis = "^5.0.1"

# Security and validation
django-cors-headers = "^4.3.1"

# Monitoring
sentry-sdk = "^1.38.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "airprediction.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
